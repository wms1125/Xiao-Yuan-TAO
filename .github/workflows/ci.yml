name: CI

# 说明：
# - 后端 job 覆盖「可编译 + 单元测试 + 覆盖率门禁 + 代码规范门禁 + 静态分析门禁」：
#   一条 `mvn verify` 即完成 package → test → jacoco report/check（行 ≥70%、分支 ≥62%，棘轮基线）
#   → spotless:check（后端 Java 卫生类检查）
#   → checkstyle:check（校园淘自有代码结构化缺陷：通配符/重复 import、未使用局部变量、
#      省略花括号、空 catch 块；规则集 campus-tao/RuoYi-Vue-master/config/checkstyle/）
#   → spotbugs:check（校园淘自有代码字节码级缺陷，effort=Max + threshold=Medium；
#      排除规则 campus-tao/RuoYi-Vue-master/config/spotbugs/）。
#   三者职责分离不重叠：spotless 管排版、checkstyle 管源码结构、spotbugs 管字节码语义。
# - 前端 job 覆盖「静态检查 + 单测 + 覆盖率门禁 + 可构建」：npm ci 保证依赖与
#   package-lock.json 一致；prettier --check 与 eslint 先行，任一步失败即中止。
# - 静态检查口径：Prettier 只校验不改写；ESLint 要求 0 error（warn 不阻断）。
# - 安全 job 覆盖依赖漏洞：前端 npm audit（生产依赖树要求 0 告警）+ 后端 osv-scanner 扫 pom.xml。
# - 端到端回归（e2e_business.py）已纳入 CI：e2e job 拉起 MySQL 8 与 Redis service，
#   导入全量建库脚本后启动后端 jar，执行双账号全链路回归（含防超卖/越权/退款回滚断言）。
#   同 job 内还真实执行 SQL 层集成测试（CampusMapperSqlIntegrationTest / CampusAccountAtomicSqlTest）：
#   这两类用例直连真实 MySQL，在无库的 backend job 会自动跳过，故必须在有 service 的 e2e job 里跑。
#   本地等价执行见仓库根 verify.bat 与 campus-tao/启动说明.md。
# - flyway job 验证数据库版本化迁移：空库迁移 → 逐表行数与全量脚本核对 → 回滚 → 重放 → 再核对。
#   对应 db/tools/verify_flyway.sh，本地等价执行见 campus-tao/RuoYi-Vue-master/db/rollback/README.md。
# - docker job 验证容器化交付物真的能构建：docker build 后端与前端镜像，
#   并以 compose 起栈后打后端健康检查，避免 Dockerfile 长期失修。
# - 远程仓库：https://github.com/wms1125/Xiao-Yuan-TAO.git（origin/main），push 即触发。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: 后端构建 · 单元测试 · 覆盖率门禁
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: campus-tao/RuoYi-Vue-master
    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK 17 与 Maven 缓存
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: |
            campus-tao/RuoYi-Vue-master/pom.xml
            campus-tao/RuoYi-Vue-master/*/pom.xml

      # verify = clean package + test + jacoco:report/check + spotless:check
      # 覆盖率或代码规范不达标时该步骤直接失败，构建产物不会上传。
      - name: 构建 · 测试 · 覆盖率与代码规范门禁（mvn -B verify）
        run: mvn -B verify

      - name: 上传后端构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ruoyi-admin-jar
          path: campus-tao/RuoYi-Vue-master/ruoyi-admin/target/ruoyi-admin.jar
          if-no-files-found: error

      - name: 上传后端测试 · 覆盖率 · 静态分析报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-quality-reports
          path: |
            campus-tao/RuoYi-Vue-master/ruoyi-system/target/site/jacoco/
            campus-tao/RuoYi-Vue-master/ruoyi-system/target/surefire-reports/
            campus-tao/RuoYi-Vue-master/ruoyi-system/target/checkstyle-result.xml
            campus-tao/RuoYi-Vue-master/ruoyi-system/target/spotbugsXml.xml
          if-no-files-found: warn

  e2e:
    name: 端到端业务回归（MySQL 8 · 双账号全链路）
    runs-on: ubuntu-latest
    needs: [backend]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 123456
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p123456 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      # 应用内置的 embedded-redis 在端口被占用时会自动让位（见 EmbeddedRedisConfig），
      # 故这里直接提供官方 Redis service，避免依赖 jar 内打包的 Linux 版 redis-server 二进制。
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      # 应用已移除内置默认凭据（缺失即启动失败），CI 显式注入一次性值；
      # 均为构建容器的临时值，非真实密钥。
      DB_USERNAME: root
      DB_PASSWORD: 123456
      JWT_SECRET: ci-e2e-only-jwt-secret
      DRUID_LOGIN_USERNAME: ruoyi
      DRUID_LOGIN_PASSWORD: 123456
    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK 17 与 Maven 缓存
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: |
            campus-tao/RuoYi-Vue-master/pom.xml
            campus-tao/RuoYi-Vue-master/*/pom.xml

      # 全量脚本自带 CREATE DATABASE campus_tao 与 USE，故直接整份导入。
      # 它等价于 Flyway 的 V1 基线（42 表、不含 V2 内容），导入后**故意不手工套增量脚本**：
      # 让下面的「启动后端」由应用自身的 Flyway 完成存量库升级（baseline V1 → apply V2），
      # 这才是真实用户拿到的路径。手工预先套 migration-v1.0.17.sql 反而会和后到的 Flyway
      # 撞车——V2 的 `ALTER TABLE campus_order ADD COLUMN address_snapshot` 非幂等，
      # 列已存在时 Flyway 报 Duplicate column，应用直接启动失败。
      - name: 导入全量建库脚本（V1 基线状态）
        run: |
          mysql -h 127.0.0.1 -uroot -p123456 < campus-tao/sql/campus_tao_full.sql
          mysql -h 127.0.0.1 -uroot -p123456 -N -e "select concat('campus_product rows=', count(*)) from campus_tao.campus_product"

      # 单测与覆盖率门禁已在 backend job 完成，这里只产出可运行的发行 jar
      - name: 打包后端
        working-directory: campus-tao/RuoYi-Vue-master
        run: mvn -B -DskipTests clean package

      # 关键一步：库处于「存量 42 表、无 flyway_schema_history」的状态，
      # 应用启动时 Flyway 应打基线到 V1 并补应用 V2，自动升到 47 表。
      - name: 启动后端（Flyway 自动完成存量库升级）
        run: |
          nohup java -jar campus-tao/RuoYi-Vue-master/ruoyi-admin/target/ruoyi-admin.jar > /tmp/backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null; then
              echo "后端已就绪"
              exit 0
            fi
            sleep 2
          done
          echo "后端启动超时，输出日志尾部："
          tail -100 /tmp/backend.log
          exit 1

      # 断言 Flyway 真的升级了存量库，而不是「应用能启动」就放过。
      # 应用能启动 ≠ 迁移生效：Spring Boot 4 把自动配置拆成独立模块，只引 flyway-core
      # 不会激活 FlywayAutoConfiguration——应用照常启动、health 也是 UP，但迁移静默不执行。
      - name: 断言 Flyway 版本记录与表数（迁移生效的证据）
        run: |
          mysql -h 127.0.0.1 -uroot -p123456 -e \
            "select installed_rank, version, description, success from campus_tao.flyway_schema_history order by installed_rank"
          echo "--- 期望：1(baseline) + 2~5 全部 success=1 ---"
          mysql -h 127.0.0.1 -uroot -p123456 -N -e \
            "select concat('tables=', count(*)) from information_schema.tables where table_schema='campus_tao' and table_type='BASE TABLE'"
          mysql -h 127.0.0.1 -uroot -p123456 -N -e \
            "select concat('baseline_ok=', count(*)) from campus_tao.flyway_schema_history where version='1' and success=1"
          mysql -h 127.0.0.1 -uroot -p123456 -N -e \
            "select concat('v2_ok=', count(*)) from campus_tao.flyway_schema_history where version='2' and success=1"
          # V5 统一了校园表排序规则。这里断言"0 张非 0900 校园表"：
          # 一旦有人再写出 COLLATE=utf8mb4_general_ci 的建表语句，站内信会话列表
          # 会重新报 Illegal mix of collations（V5 修的就是这个），本断言提前拦住。
          mysql -h 127.0.0.1 -uroot -p123456 -N -e \
            "select concat('collation_ok=', count(*) = 0) from information_schema.tables where table_schema='campus_tao' and table_name like 'campus\\_%' and table_collation <> 'utf8mb4_0900_ai_ci'"
          mysql -h 127.0.0.1 -uroot -p123456 -N -e \
            "select concat('address_snapshot_ok=', count(*)) from information_schema.columns where table_schema='campus_tao' and table_name='campus_order' and column_name='address_snapshot'"

      # 接口契约门禁：归档的 OpenAPI 规格必须与运行时一致。
      # 这样"契约"才是可核验的单一事实来源，而不是"只有 /v3/api-docs 跑起来才有"：
      # 一旦改了接口却忘记重新导出规格，本步骤会精确报出多/少了哪个 path×method 并阻断。
      # 归档文件：campus-tao/docs/openapi/campus-tao-openapi.json（194 path / 218 操作）
      # 本地等价命令：python campus-tao/tools/verify_openapi.py
      - name: 校验归档 OpenAPI 规格与运行时一致（契约门禁）
        run: python3 campus-tao/tools/verify_openapi.py

      # SQL 层集成测试（真实 mapper XML / 原子 UPDATE）× 真实 MySQL。
      # 这些用例在无库环境下靠 Assumptions 自动跳过，故 backend job（无 MySQL service）
      # 只会显示 skipped；真正执行它们的是这里——用 service 容器当数据库。
      # 放在后端启动之后：campus_order.address_snapshot 属 V2，须待 Flyway 升级后才存在。
      - name: SQL 层集成测试（mapper XML 与原子 SQL × MySQL）
        working-directory: campus-tao/RuoYi-Vue-master
        run: mvn -B -Dtest=CampusMapperSqlIntegrationTest,CampusAccountAtomicSqlTest -Dsurefire.failIfNoSpecifiedTests=false test

      - name: 执行端到端业务回归
        run: python3 campus-tao/e2e_business.py

      # ------------------------------------------------------------------
      # 浏览器级 E2E：证明「用户点下去对」，补上接口脚本证明不了的那一半。
      #
      # 分工：e2e_business.py 打 HTTP，验后端业务逻辑；本步骤开真实 Chrome 点界面。
      # 为什么必须放在这个 job：用例需要真实后端 + 真实 MySQL + 演示数据，
      # 这里三样都齐了，另起一个 job 等于把整套环境再搭一遍。
      #
      # 用 runner 自带的 Chrome（playwright.config.js 里 channel: 'chrome'），
      # 不下载 Chromium；headless 由 CI 环境自动生效。
      # ------------------------------------------------------------------
      - name: 设置 Node 22（浏览器 E2E）
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: campus-tao-ui/package-lock.json

      - name: 安装前端依赖（浏览器 E2E）
        working-directory: campus-tao-ui
        run: npm ci

      - name: 浏览器 E2E（Playwright · 真实 Chrome · headless）
        working-directory: campus-tao-ui
        run: npx playwright test
        env:
          # 播种脚本直连后端（不经 Vite 代理），端口与上面的启动步骤保持一致
          E2E_API_URL: http://127.0.0.1:8080

      # 失败留证据：trace（可回放每一步）+ video + 截图。
      # 这三样是"红了之后能在本地复现"的前提，比日志有用得多。
      - name: 上传浏览器 E2E 失败证据（trace / video / 截图）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-artifacts
          path: campus-tao-ui/test-results/
          if-no-files-found: ignore

      - name: 失败时输出后端日志
        if: failure()
        run: tail -150 /tmp/backend.log

  frontend:
    name: 前端单测 · 覆盖率门禁 · 生产构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: campus-tao-ui
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: campus-tao-ui/package-lock.json

      - name: 安装依赖（严格按 lock 文件）
        run: npm ci

      # 静态检查：Prettier 只做校验不改写。
      # ESLint 分两档：全仓 0 error 门禁（脚手架既有债的 161 条 warn 不阻断，仅日志可见），
      # 自有代码另跑 0 warning 门禁（lint:strict）。
      # .eslintrc-auto-import.json 由 unplugin-auto-import 在构建期产出并随仓库提交，
      # 故 npm ci 之后即可直接 lint，无需先构建。
      - name: 格式校验（prettier --check）
        run: npm run format:check

      - name: 代码检查（eslint，全仓 0 error 门禁）
        run: npm run lint

      # 校园淘自有代码执行更严的 0 warning 门禁：脚手架（若依）遗留的 161 条 warn
      # 属于上游债务，不计入本项目质量口径；自有目录必须做到 warn 也为零，
      # 防止新增代码把告警混进既有噪声里被长期忽略。
      - name: 自有代码严格检查（eslint --max-warnings 0，仅校园淘目录）
        run: npm run lint:strict

      # vitest run --coverage：v8 provider，阈值为棘轮基线（行 ≥68 / 分支 ≥64 / 语句 ≥67 / 函数 ≥72）
      - name: 单元测试 + 覆盖率门禁（vitest + v8）
        run: npm run test:coverage

      - name: 生产构建
        run: npm run build:prod

      - name: 上传前端覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: campus-tao-ui/coverage/
          if-no-files-found: warn

  # ==========================================================================
  # 数据库版本化迁移（Flyway）：空库迁移 → 行数核对 → 回滚 → 重放 → 再核对
  #
  # 直接用 flyway-maven-plugin（`mvn -N flyway:*`）执行迁移，**不启动应用**：
  # 应用启动会写入 sys_job_log 等运行期数据，干扰"逐表行数与全量脚本一致"的判定。
  # 应用侧的 Flyway 装配（spring-boot-flyway 依赖 + spring.flyway 配置）由
  # e2e job 隐式覆盖——那个 job 用空库启动应用，启动成功即证明迁移在应用内生效。
  # ==========================================================================
  flyway:
    name: 数据库迁移与回滚（Flyway · 逐表行数核对）
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 123456
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p123456 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USERNAME: root
      DB_PASSWORD: 123456
    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK 17 与 Maven 缓存
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: |
            campus-tao/RuoYi-Vue-master/pom.xml
            campus-tao/RuoYi-Vue-master/*/pom.xml

      - name: 迁移与回滚端到端验证
        run: bash campus-tao/RuoYi-Vue-master/db/tools/verify_flyway.sh

      - name: 输出核对明细
        if: always()
        run: |
          echo "===== 空库迁移后核对 ====="
          cat /tmp/cmp1.txt 2>/dev/null || true
          echo "===== 回滚后重放核对 ====="
          cat /tmp/cmp2.txt 2>/dev/null || true

  # ==========================================================================
  # 容器化交付物：镜像必须真的能构建，且 compose 起栈后后端能通过健康检查
  # ==========================================================================
  docker:
    name: 容器镜像构建与起栈自检（Dockerfile · docker compose）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # compose 的 .env 不入库，这里由 CI 生成一次性值（非真实密钥）
      - name: 生成 CI 环境变量
        run: |
          cat > .env <<'EOF'
          APP_VERSION=ci
          DB_NAME=campus_tao
          DB_USERNAME=root
          DB_PASSWORD=ci-docker-only-password
          JWT_SECRET=ci-docker-only-jwt-secret-at-least-32-bytes
          DRUID_LOGIN_USERNAME=ruoyi
          DRUID_LOGIN_PASSWORD=ci-docker-only-druid-password
          MYSQL_PORT=3307
          BACKEND_PORT=8080
          UI_PORT=8088
          EOF

      - name: 构建镜像（后端 + 前端）
        run: docker compose build

      - name: 起栈并等待后端健康
        run: |
          docker compose up -d
          ok=0
          for i in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' campus-tao-backend 2>/dev/null || echo none)
            echo "第 ${i} 次探测：backend health = ${status}"
            if [ "$status" = "healthy" ]; then ok=1; break; fi
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "::error::后端容器未在预期时间内进入 healthy"
            docker compose logs --tail=200 backend
            exit 1
          fi

      - name: 验证前端可达且接口反代生效
        run: |
          curl -fsS http://localhost:8088/ > /dev/null && echo "前端静态页可达"
          # 未带 token 访问受保护接口应返回业务错误码（证明 /prod-api 反代到了后端）
          code=$(curl -s -o /tmp/api.json -w '%{http_code}' http://localhost:8088/prod-api/captchaImage)
          echo "captchaImage HTTP $code, body: $(head -c 120 /tmp/api.json)"
          [ "$code" = "200" ] || { echo "::error::前端反代后端失败"; exit 1; }

      - name: 失败时输出容器日志
        if: failure()
        run: docker compose logs --tail=200

      - name: 清理
        if: always()
        run: docker compose down -v

  security:
    name: 依赖漏洞扫描（前端 npm audit · 后端 osv-scanner）
    runs-on: ubuntu-latest
    steps:
      # 必须拉全量历史：密钥一旦提交过，"后来删掉"并不算撤回。而 actions/checkout 的
      # 默认浅克隆（depth=1）会让 gitleaks 的 `HEAD^..HEAD` 拿不到父提交、
      # 直接报 unknown revision 而失败——结果是这一路扫描从落地起就没真正生效过，
      # 却因为构建红着而让人以为它在干活。fetch-depth 只能写在 checkout 上：
      # gitleaks-action 并不接受这个输入（写上去只会在日志里告警 Unexpected input）。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 必须使用官方 registry：国内镜像是只读副本，未实现 /-/npm/v1/security/* 接口会返回 404。
      - name: 前端依赖审计（生产依赖树要求 0 告警）
        working-directory: campus-tao-ui
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=low --registry=https://registry.npmjs.org

      # 直接扫随包交付的 CycloneDX 物料清单（backend-bom.json），
      # 避免在 CI 中重新解析 Maven 依赖树，结果与人工扫描口径一致。
      # 豁免登记见 campus-tao/sbom/osv-scanner.toml（当前仅 1 条：本仓库一手模块
      # com.ruoyi:ruoyi-common 与上游 RuoYi-Cloud 同名构件产生的坐标碰撞），每条均附理由与复核期限。
      # 注意：osv-scanner 只读「被扫描文件所在目录」下的 osv-scanner.toml 且不向子目录传播，
      # 故该文件必须与 backend-bom.json 同目录——放在仓库根目录不会生效。
      # 未登记的告警照常阻断构建。
      - name: 后端依赖漏洞扫描（osv-scanner）
        uses: google/osv-scanner-action/osv-scanner-action@v1.9.0
        with:
          scan-args: |-
            --sbom=campus-tao/sbom/backend-bom.json

      # ------------------------------------------------------------------
      # 密钥泄漏扫描（gitleaks，扫全量 git 历史）
      #
      # 为什么扫历史而不是只扫当前工作区：密钥一旦提交过，"后来删掉"并不算撤回，
      # 尤其这个仓库在 GitHub 上。只扫最后一次提交等于主动放弃这条最能查出问题的路。
      # 本仓库第一次跑就抓到一个真实结果：若依脚手架带来的 RSA 私钥曾把用户记住的
      # 密码加密后写进 cookie（该功能已删除），配置与取舍逐条写在 .gitleaks.toml 里。
      #
      # 用官方 action 而不是自己装二进制：版本由 tag 固定，CI 环境无需外部下载。
      # ------------------------------------------------------------------
      - name: 密钥泄漏扫描（gitleaks · 全量历史）
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================================================
  # 静态代码分析（CodeQL · Java + JavaScript/TypeScript）
  #
  # 与 gitleaks 的分工：gitleaks 管"密钥别进仓库"，CodeQL 管"代码里的坏味道会变成漏洞"
  # （注入、路径穿越、反序列化、某些 XSS 等）。两者互补，谁也替代不了谁。
  #
  # 为什么暂时不设为 required status check：本 job 的首次运行结果无法在本地预演，
  # 先让它真跑一次、看到具体告警清单，再决定哪些要修、阈值怎么设。
  # 一条没跑过就设为必需的检查，第一次拦住急活时就会被整个关掉。
  # 首次全绿后再同步进 deploy/github/branch-protection.json（注意同步 README）。
  #
  # 别重新命名这个 job：name 与 required status check 一一对应，改名会让 PR 卡在
  # "Expected — Waiting for status to be reported"。
  # ==========================================================================
  codeql:
    name: 静态代码分析（CodeQL · Java + JS/TS）
    runs-on: ubuntu-latest
    needs: [backend]
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      # CodeQL 的 Java 分析需要可用 JDK（自动构建会调用 mvn）
      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: |
            campus-tao/RuoYi-Vue-master/pom.xml
            campus-tao/RuoYi-Vue-master/*/pom.xml

      - name: 初始化 CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java, javascript-typescript

      # 自动构建本项目（根 pom 是 Maven 工程）；codeql-action 的 autobuild
      # 会调用 mvn 完成增量编译，Java 分析才有可查询的数据库。
      - name: 分析（CodeQL）
        uses: github/codeql-action/analyze@v3
