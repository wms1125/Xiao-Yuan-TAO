name: CI

# 说明：
# - 后端 job 覆盖「可编译 + 单元测试」，仓库未提供 mvnw，使用 setup-java 内置的 Maven。
# - 前端 job 覆盖「单元测试（vitest）+ 可构建」，用 npm ci 保证依赖与 package-lock.json 一致。
# - 端到端回归（e2e_business.py）未纳入 CI：它需要可达的 MySQL 8 与已初始化的库，
#   本地请用仓库根的 verify.bat 或手工执行；如需上 CI，可另加 services: mysql 的 job。
# - 仓库当前为本地库（无远程），推送后本工作流即自动生效。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: 后端构建与单元测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: campus-tao/RuoYi-Vue-master
    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK 17 与 Maven 缓存
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: |
            campus-tao/RuoYi-Vue-master/pom.xml
            campus-tao/RuoYi-Vue-master/*/pom.xml

      - name: 打包（-DskipTests，先确保源码可编译）
        run: mvn -B -DskipTests clean package

      - name: 单元测试
        run: mvn -B test

      - name: 上传后端构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ruoyi-admin-jar
          path: campus-tao/RuoYi-Vue-master/ruoyi-admin/target/ruoyi-admin.jar
          if-no-files-found: error

  frontend:
    name: 前端单测与构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: campus-tao-ui
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: campus-tao-ui/package-lock.json

      - name: 安装依赖（严格按 lock 文件）
        run: npm ci

      - name: 单元测试（vitest）
        run: npm run test:unit

      - name: 生产构建
        run: npm run build:prod
