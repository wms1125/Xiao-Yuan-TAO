name: Release Images

# 说明：
# - 触发：推送 v* tag（正式发布）或手动触发（需指定版本号）。
# - 构建后端与前端两个镜像，推送到 GitHub Container Registry（GHCR），
#   同时打 <version> 与 latest 两个 tag。
# - 每个镜像的 digest 先作为 Actions artifact 归档；record job 再把汇总文件
#   挂到同名 GitHub Release，使「取制品即用」覆盖到容器镜像层。
# - scan job 按 digest 用 Trivy 扫描两个镜像的 CRITICAL/HIGH 漏洞（忽略无修复版本的），
#   CRITICAL 即判失败；报告随 Release 一起归档，作为「镜像里到底有什么」的证据。
# - 与 ci.yml 的 docker job 分工：ci.yml 只验证镜像能构建、能起栈；
#   本 workflow 负责发布、扫描与归档，只在 tag 上运行。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '镜像版本号（如 1.0.22）'
        required: true

permissions:
  contents: write   # 上传 digest 汇总到 Release
  packages: write   # 推送镜像到 GHCR

env:
  REGISTRY: ghcr.io

jobs:
  images:
    name: 镜像 ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: campus-tao-backend
            context: campus-tao/RuoYi-Vue-master
          - image: campus-tao-ui
            context: campus-tao-ui
    steps:
      - uses: actions/checkout@v4

      - name: 解析版本号
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            v="${{ inputs.version }}"
          else
            v="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "镜像版本：$v"

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: 构建并推送
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: 归档镜像 digest
        run: |
          echo "${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}" \
            > "digest-${{ matrix.image }}.txt"
          cat "digest-${{ matrix.image }}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}
          path: digest-${{ matrix.image }}.txt

  scan:
    name: 漏洞扫描 ${{ matrix.image }}
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: campus-tao-backend
          - image: campus-tao-ui
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: digest-${{ matrix.image }}
          path: digest

      - name: 解析被测 digest
        id: digest
        run: |
          d=$(grep -o 'sha256:[0-9a-f]\{64\}' digest/digest-*.txt | head -1)
          test -n "$d" || { echo "::error::未从 digest 文件中解析到 sha256"; exit 1; }
          echo "digest=$d" >> "$GITHUB_OUTPUT"
          echo "被测镜像：${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}@$d"

      # 只扫描有修复版本的 CRITICAL/HIGH，避免「基础镜像里无法修复的漏洞」把发布永久卡红。
      - name: Trivy 扫描
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.digest.outputs.digest }}
          format: json
          output: trivy-${{ matrix.image }}.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          scanners: vuln
          exit-code: '0'

      - name: 生成摘要并执行 CRITICAL 门禁
        run: |
          report="trivy-${{ matrix.image }}.json"
          crit=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' "$report")
          high=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' "$report")
          summary="trivy-${{ matrix.image }}-summary.md"
          {
            echo "## ${{ matrix.image }}"
            echo
            echo "- 镜像：\`${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.digest.outputs.digest }}\`"
            echo "- 范围：CRITICAL/HIGH，已忽略无修复版本（ignore-unfixed）"
            echo
            echo "| 严重度 | 数量 |"
            echo "|---|---|"
            echo "| CRITICAL | ${crit} |"
            echo "| HIGH | ${high} |"
            if [ "$crit" -gt 0 ] || [ "$high" -gt 0 ]; then
              echo
              echo '```'
              jq -r '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL" or .Severity=="HIGH")]
                     | sort_by(.Severity) | .[:15][]
                     | "\(.Severity)\t\(.VulnerabilityID)\t\(.PkgName)\t\(.InstalledVersion)\t\(.FixedVersion // "-")"' "$report"
              echo '```'
            fi
          } > "$summary"
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          if [ "$crit" -gt 0 ]; then
            echo "::error::${{ matrix.image }} 存在 ${crit} 个可修复的 CRITICAL 漏洞"
            exit 1
          fi
          echo "${{ matrix.image }}：CRITICAL=${crit}，HIGH=${high}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-${{ matrix.image }}
          path: |
            trivy-${{ matrix.image }}.json
            trivy-${{ matrix.image }}-summary.md

  record:
    name: 汇总 digest 并挂到 Release
    needs: [images, scan]
    # 扫描失败也要让 digest 与报告落到 Release，红叉本身就是门禁结论
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: scandata
          pattern: trivy-*
          merge-multiple: true

      - name: 汇总 digest 文件
        run: |
          version="${GITHUB_REF_NAME#v}"
          out="campus-tao-images-v${version}.txt"
          {
            echo "# 校园淘 v${version} 容器镜像 digest"
            echo "# 生成时间：$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "# 拉取：docker pull ghcr.io/${{ github.repository_owner }}/campus-tao-backend:${version}"
            echo
            cat digests/digest-*.txt | sort
          } > "$out"
          cat "$out"
          echo "ASSET=$out" >> "$GITHUB_ENV"

      - name: 汇总扫描报告
        run: |
          version="${GITHUB_REF_NAME#v}"
          out="campus-tao-security-scan-v${version}.md"
          {
            echo "# 校园淘 v${version} 容器镜像漏洞扫描"
            echo
            echo "- 扫描器：Trivy（severity=CRITICAL,HIGH，ignore-unfixed=true）"
            echo "- 生成时间：$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            if ls scandata/*-summary.md > /dev/null 2>&1; then
              for f in scandata/*-summary.md; do cat "$f"; echo; done
            else
              echo "> 本次未取得扫描报告（扫描 job 未成功执行），请查看 Actions 运行记录。"
            fi
          } > "$out"
          for f in scandata/trivy-*.json; do
            [ -e "$f" ] || continue
            base=$(basename "$f" .json)
            name=${base#trivy-}
            cp "$f" "trivy-${name}-v${version}.json"
          done
          ls -l "$out" trivy-*-v"${version}".json 2>/dev/null || true
          echo "SCAN_ASSET=$out" >> "$GITHUB_ENV"

      - name: 上传到 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 本 job 未 checkout 仓库，gh 没有本地仓库上下文，必须显式 --repo；
          # 缺这一项时 gh release view 会以 "not a git repository" 静默失败并空转到超时。
          # Release 可能比镜像构建更晚创建，最多等待约 20 分钟
          shopt -s nullglob
          files=("$ASSET" "$SCAN_ASSET")
          files+=(trivy-*-v*.json)
          for i in $(seq 1 80); do
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
              echo "digest 与扫描报告已挂到 Release $GITHUB_REF_NAME"
              exit 0
            fi
            echo "第 ${i} 次等待 Release $GITHUB_REF_NAME ..."
            sleep 15
          done
          echo "::error::Release $GITHUB_REF_NAME 未创建，digest 仅保留在 Actions artifact 中"
          exit 1
