# ============================================================================
# 校园淘 · gitleaks 密钥扫描配置
#
# 与 CI 的关系：.github/workflows/ci.yml 的 security job 用 gitleaks-action
# 扫**全量 git 历史**。扫历史而不是只扫当前工作区——密钥一旦提交过，
# "后来删掉"并不算撤回，尤其是这个仓库在 GitHub 上。只扫最后一次提交等于
# 主动放弃这条最能查出问题的路径。
#
# 规则来源：沿用官方默认规则集（useDefault），不自造规则，避免两套口径打架。
# ============================================================================
title = "校园淘 gitleaks 配置"

[extend]
# 使用 gitleaks 内置规则集
useDefault = true

# ----------------------------------------------------------------------------
# 唯一一条豁免：若依脚手架自带的 RSA 演示密钥对
#
# 命中位置：campus-tao-ui/src/utils/jsencrypt.js（历史提交，文件本身已删除）
# 全历史扫描会命中它两次：初始提交 16d8828、格式化提交 76280e4。
#
# 为什么可以登记为豁免，而不是"再清洗一次历史"：
# 1. 这把密钥对来自若依（RuoYi-Vue）上游脚手架，随初始化提交进入本仓库，
#    不是本项目自己生成或引入的凭据。
# 2. 后端**从来没有**用它解过任何东西——ruoyi-framework 里没有任何 RSA
#    解密逻辑，登录请求提交的始终是明文密码（已核实）。
# 3. 它在前端的唯一用途是"记住密码"时把密码加密写进 cookie 再解出来回填。
#    这个功能已经在本次重构中删除（见 src/views/login.vue 的注释），
#    因为前端既要加密又要解密，私钥只能放在前端，等于把钥匙和锁一起交给用户。
# 4. 因此它不保护任何真实资产，密钥内容本身没有可利用价值。
#
# 为什么没有去清洗历史：清洗要强推 main，而分支保护明确禁止强推
# （deploy/github/branch-protection.json 中 allowsForcePush=false）。
# 用一条会禁掉整个安全规则的方式去抹掉一条低危残留，代价明显不划算。
#
# 复核条件（满足任一即重新评估本豁免，不要让它变成永久免死金牌）：
#   - 仓库转为公开，或新增了任何协作成员；
#   - 这把密钥对出现在本项目自写的代码里（那就不是上游脚手架了）；
#   - gitleaks 默认规则升级后又在本路径命中别的内容。
# ----------------------------------------------------------------------------
[allowlist]
description = "若依脚手架自带的 RSA 演示密钥对：不保护任何真实资产，唯一使用方已被删除"
paths = [
  '''campus-tao-ui/src/utils/jsencrypt\.js''',
]
