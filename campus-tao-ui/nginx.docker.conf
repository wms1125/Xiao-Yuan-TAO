# ============================================================================
# 校园淘 · 容器内 Nginx 配置（HTTP，供 docker-compose 使用）
#
# 与 deploy/nginx.conf（生产 HTTPS 参考配置）的区别：
#   - 只监听 80，不做 TLS 终止（TLS 由外层网关/负载均衡负责）；
#   - upstream 用 compose 服务名 backend:8080，而非 127.0.0.1:8080；
#   - 站点根目录为镜像内 /usr/share/nginx/html。
# 两者业务规则一致：/prod-api 剥离前缀反代、/profile 透传、SPA 回落 index.html。
# ============================================================================

upstream campus_tao_backend {
    server backend:8080;
    keepalive 32;
}

gzip on;
gzip_static on;
gzip_vary on;
gzip_min_length 1k;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    # ---------- 安全响应头 ----------
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---------- 静态资源 ----------
    location ^~ /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ^~ /campus-img/ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ---------- 接口反代：/prod-api/xxx → 后端 /xxx ----------
    location /prod-api/ {
        proxy_pass http://campus_tao_backend/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # ---------- 上传文件访问 ----------
    location /profile/ {
        proxy_pass http://campus_tao_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- SPA 兜底 ----------
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
