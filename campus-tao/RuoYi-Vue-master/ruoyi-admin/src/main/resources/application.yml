# 项目相关配置
ruoyi:
  # 名称
  name: RuoYi
  # 版本
  version: 3.9.2
  # 版权年份
  copyrightYear: 2026
  # 文件路径（相对运行目录，跨机器可复现）
  profile: ./uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 可观测性配置（Actuator）
management:
  health:
    redis:
      # 关闭 Redis 健康指示器：发行包内嵌的是 Windows 版 redis-server 5.0.14，
      # 其 INFO 输出含自身可执行文件路径（如 C:\Users\...\redis-server-*.exe），
      # Lettuce 读取 INFO 后交由 java.util.Properties.load 解析，遇到 "\U" 会抛
      # IllegalArgumentException: Malformed \uxxxx encoding，导致健康检查误报 DOWN。
      # Redis 连通性由业务链路（验证码/登录令牌/配置缓存）实际验证，进程无 Redis 时启动即失败。
      enabled: false
  endpoints:
    # 默认关闭所有端点，仅按需开放；避免 /actuator/env 等敏感端点暴露
    access:
      default: none
    web:
      exposure:
        # prometheus 供 Prometheus 抓取（校园淘业务指标见 com.ruoyi.campus.observability.CampusMetrics）。
        # 该端点匿名开放（见 SecurityConfig），生产部署必须由 nginx/网络策略限制为内网可达，
        # 禁止对公网暴露——指标会泄漏业务量与调用结构。
        include: health,info,prometheus
  endpoint:
    health:
      access: read-only
      # 不对外暴露组件细节，仅返回 UP/DOWN
      show-details: never
    info:
      access: read-only
    prometheus:
      access: read-only
  info:
    env:
      enabled: true

# 应用信息（/actuator/info 展示）
info:
  app:
    name: campus-tao
    description: 校园淘 校园二手交易平台
    version: 1.0.24

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.ruoyi: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 数据库版本化迁移（Flyway）
  # 迁移脚本：classpath:db/migration/V*.sql；回滚脚本：db/rollback/U*.sql（Community 版无 undo，见 db/rollback/README.md）
  # baseline-on-migrate + baseline-version=1：
  #   - 空库 → 依次执行 V1、V2 …（全新环境由 Flyway 建表）
  #   - 已建库（导入过 campus_tao_full.sql、无 flyway_schema_history）→ 打基线到 V1，只补执行 V2 及之后
  # 目标库由下方 spring.datasource 连接串决定，迁移脚本内不得出现 CREATE DATABASE / USE。
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: baseline_campus_tao
    table: flyway_schema_history
    validate-on-migrate: true
    out-of-order: false
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  # 服务模块
  devtools:
    restart:
      # 热部署开关（演示环境关闭，避免重启抢占随机端口导致 8080 不可达）
      enabled: false
  data:
    # redis 配置
    redis:
      # 地址（容器部署由 REDIS_HOST 指向 compose 的 redis 服务）
      host: ${REDIS_HOST:localhost}
      # 端口，默认为6379
      port: ${REDIS_PORT:6379}
      # 数据库索引
      database: 0
      # 密码
      password:
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥：必须由环境变量 JWT_SECRET 注入。
  # 刻意不提供默认值——带默认值的密钥在生产环境一旦忘记覆盖即等于无防护，故改为缺失即启动失败。
  # 本地/演示环境由 2-启动后端.bat 注入演示值。
  secret: ${JWT_SECRET}
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Springdoc配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '测试模块'
      paths-to-match: '/**'
      packages-to-scan: com.ruoyi.web.controller.tool

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1,ruoyi.vip,www.ruoyi.vip

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# 校园淘业务配置
campus:
  order:
    # 未支付订单自动取消超时（分钟），可由环境变量 CAMPUS_PAY_TIMEOUT_MINUTES 覆盖
    pay-timeout-minutes: ${CAMPUS_PAY_TIMEOUT_MINUTES:30}
  # 支付渠道：channel 决定走哪个 IPaymentGateway 实现（sandbox | wechat），
  # 切换渠道只改这里、不改业务代码。默认 sandbox（站内余额，唯一已跑通的渠道）。
  # 微信商户参数未填齐时 enabled 判定为 false，渠道路由会明确报错而非静默回落沙箱。
  # 密钥一律通过环境变量注入，禁止在本文件写明文口令。
  payment:
    channel: ${CAMPUS_PAYMENT_CHANNEL:sandbox}
    wechat:
      enabled: ${CAMPUS_WECHAT_PAY_ENABLED:false}
      app-id: ${CAMPUS_WECHAT_APP_ID:}
      mch-id: ${CAMPUS_WECHAT_MCH_ID:}
      api-v3-key: ${CAMPUS_WECHAT_API_V3_KEY:}
      serial-no: ${CAMPUS_WECHAT_SERIAL_NO:}
      private-key-path: ${CAMPUS_WECHAT_PRIVATE_KEY_PATH:}
      notify-url: ${CAMPUS_WECHAT_NOTIFY_URL:}
  # 短信/邮件外呼通道：站内通知为必达链路，外呼为可选增强链路。
  # 网关地址未通过环境变量注入时通道自动视为「未启用」，降级为仅站内通知，并在 campus_notify_log 留痕。
  # 密钥一律通过环境变量注入，禁止在本文件写明文口令。
  notify:
    sms:
      endpoint: ${CAMPUS_SMS_ENDPOINT:}
      app-key: ${CAMPUS_SMS_APP_KEY:}
      sign: ${CAMPUS_SMS_SIGN:校园淘}
    email:
      endpoint: ${CAMPUS_MAIL_ENDPOINT:}
      app-key: ${CAMPUS_MAIL_APP_KEY:}
      from: ${CAMPUS_MAIL_FROM:noreply@campus-tao.local}
  # 物流轨迹查询：网关地址未注入时自动降级（仅记录物流单号，轨迹查询返回空），不阻断订单流程。
  logistics:
    endpoint: ${CAMPUS_LOGISTICS_ENDPOINT:}
    app-key: ${CAMPUS_LOGISTICS_APP_KEY:}
    carrier: ${CAMPUS_LOGISTICS_CARRIER:SF}
    sync-limit: ${CAMPUS_LOGISTICS_SYNC_LIMIT:200}
