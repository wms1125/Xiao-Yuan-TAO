# ============================================================================
# 校园淘 · 一键容器化部署
#
#   1) 复制环境变量模板并按需修改：
#        cp .env.example .env
#   2) 构建并启动：
#        docker compose up -d --build
#   3) 访问：
#        前端  http://localhost:${UI_PORT:-8088}
#        后端  http://localhost:${BACKEND_PORT:-8080}/actuator/health
#   4) 查看日志 / 停止：
#        docker compose logs -f backend
#        docker compose down          # 保留数据卷
#        docker compose down -v       # 连同数据一起删除
#
# 数据库无需手工初始化：后端启动时由 Flyway 自动执行 db/migration 下的
# V1~V4 迁移（见 campus-tao/RuoYi-Vue-master/db/rollback/README.md）。
#
# 注意：compose 会读取仓库根目录的 .env 文件（不要提交到版本库）。
# ============================================================================

name: campus-tao

services:
  # ---------------- MySQL ----------------
  mysql:
    image: mysql:8.0
    container_name: campus-tao-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-campus_tao}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      # 仅本机可见，避免数据库直接暴露到公网
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [campus]

  # ---------------- Redis ----------------
  redis:
    image: redis:7-alpine
    container_name: campus-tao-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [campus]

  # ---------------- 后端 ----------------
  backend:
    build:
      context: ./campus-tao/RuoYi-Vue-master
      dockerfile: Dockerfile
    image: campus-tao-backend:${APP_VERSION:-1.0.27}
    container_name: campus-tao-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      DB_URL: "jdbc:mysql://mysql:3306/${DB_NAME:-campus_tao}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2B8"
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
      # 令牌密钥：缺失或过短应用会拒绝启动，请用 `openssl rand -base64 48` 生成
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}
      DRUID_LOGIN_USERNAME: ${DRUID_LOGIN_USERNAME:-ruoyi}
      DRUID_LOGIN_PASSWORD: ${DRUID_LOGIN_PASSWORD:?请在 .env 中设置 DRUID_LOGIN_PASSWORD}
      # 容器内使用 compose 提供的 redis，关闭内嵌实例
      EMBEDDED_REDIS_ENABLED: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - upload-data:/app/uploadPath
      # 日志用**具名卷**而非宿主 bind mount：容器以非 root 用户 campus 运行，
      # 而 Dockerfile 已 chown /app/logs 给该用户。bind mount（如 ./logs/backend:/app/logs）
      # 会直接用宿主目录的所有权覆盖镜像里的 chown——CI runner 上该目录由 Docker 以 root 创建，
      # 于是 logback 写 logs/sys-*.log 报 Permission denied，应用起不来、health 永远 unhealthy。
      # 具名卷在首次创建时会把镜像目录的内容**连同所有权**拷入卷内，故能正确继承 campus。
      # 需要宿主侧直接翻日志文件时，可自行改为 bind mount，但必须先把宿主目录 chown 给容器用户。
      - backend-logs:/app/logs
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    networks: [campus]

  # ---------------- 前端 ----------------
  frontend:
    build:
      context: ./campus-tao-ui
      dockerfile: Dockerfile
    image: campus-tao-ui:${APP_VERSION:-1.0.27}
    container_name: campus-tao-ui
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${UI_PORT:-8088}:80"
    networks: [campus]

volumes:
  mysql-data:
  redis-data:
  upload-data:
  backend-logs:

networks:
  campus:
    driver: bridge
