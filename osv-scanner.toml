# osv-scanner 配置
#
# 作用：登记「经核查后判定不适用于本项目」的告警，每条都必须写明理由与复核期限。
# 门禁强度不变：只有在本文件显式登记且给出理由的条目才会被忽略；未登记的告警照常阻断构建。

[[IgnoredVulns]]
id = "GHSA-vp22-232w-h9x8"
ignoreUntil = 2027-06-30
reason = """
CVE-2022-4348 / GHSA-vp22-232w-h9x8 描述的是 RuoYi-Cloud 的 JSON Handler 跨站脚本问题，
其受影响坐标被登记为 com.ruoyi:ruoyi-common（Last Affected 4.6.2）。

本项目是 RuoYi-Vue（单体版）的改造分支，com.ruoyi:ruoyi-common 是**本仓库自身的一手模块**，
不是从仓库外引入的第三方依赖。它出现在扫描结果中，是因为随包交付的 backend-bom.json 记录了
本仓库自己构建出的构件坐标，而该坐标与上游若依的同名构件重合。OSV 仅按「组:构件:版本」匹配，
无法区分「上游发布的制品」与「本地源码构建的 fork」，故产生了这次坐标碰撞。

由此可得：即便我们修补了 vendored 代码，只要版本号仍是 3.9.2，这条匹配结果就不会改变——
忽略它不是"掩盖问题"，而是承认该匹配对本仓库不具备判定力。

本次核查范围（如实记录）：已确认上游差异（advisory 针对 RuoYi-Cloud，本项目为 RuoYi-Vue）与
坐标归属（一手模块）。**未**逐行审计 Cloud 版 JSON Handler 的注入点在 RuoYi-Vue 中是否存在，
故不宣称"该漏洞在本仓库必然不成立"；保留本登记并在 ignoreUntil 到期前复核。
"""
