# ============================================================================
# 校园淘 · 生产部署 Nginx 参考配置
#
# 对应关系：
#   前端构建产物  campus-tao-ui/dist          → 静态托管（本文件中的 root）
#   后端服务      ruoyi-admin.jar（默认 8080）→ upstream campus_tao_backend
#   前端接口前缀  VITE_APP_BASE_API = /prod-api（见 campus-tao-ui/.env.production）
#   上传文件前缀  /profile（后端 Constants.RESOURCE_PREFIX，落在 ruoyi.profile 目录）
#
# 部署步骤见 campus-tao/启动说明.md「十一、生产部署」。
# 注意：本文件中的绝对路径、域名、证书路径均为示例，部署时按实际环境替换。
# ============================================================================

upstream campus_tao_backend {
    # 后端为单实例；多实例时在此追加 server 行并启用 keepalive。
    server 127.0.0.1:8080;
    keepalive 32;
}

# 压缩：前端构建已产出 .gz / .br 预压缩文件，直接用静态压缩，省 CPU。
# brotli_static 需要 ngx_brotli 模块；未安装时保持注释即可（不影响功能）。
gzip on;
gzip_static on;
gzip_vary on;
# brotli_static on;

# ---------- HTTP：仅用于跳转与 ACME 校验 ----------
server {
    listen 80;
    server_name campus-tao.example.com;

    # Let's Encrypt 等证书签发校验
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS：主站 ----------
server {
    listen 443 ssl;
    http2 on;
    server_name campus-tao.example.com;

    ssl_certificate     /etc/nginx/ssl/campus-tao.crt;
    ssl_certificate_key /etc/nginx/ssl/campus-tao.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 上传文件与请求体上限：商品图片上传走 multipart，需放宽
    client_max_body_size 20m;

    # ---------- 安全响应头 ----------
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ---------- 前端静态资源 ----------
    root /usr/share/nginx/campus-tao-ui;
    index index.html;

    # 带 hash 的构建产物可长期强缓存
    location ^~ /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 品类实拍图（随包交付）
    location ^~ /campus-img/ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # 上传目录：走后端读取（见下方 /profile 反代），此处不做静态托管

    # ---------- 接口反向代理 ----------
    # 前端请求 /prod-api/xxx → 后端 /xxx（proxy_pass 末尾的 "/" 负责剥离前缀）
    location /prod-api/ {
        proxy_pass http://campus_tao_backend/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # 上传文件访问（后端 addResourceHandlers 暴露 /profile/**）
    location /profile/ {
        proxy_pass http://campus_tao_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 接口文档：默认只允许内网访问，避免生产暴露
    location ~ ^/(v3/api-docs|swagger-ui) {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://campus_tao_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 健康检查直连后端，便于探活脚本使用（不暴露给公网）
    location = /actuator/health {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://campus_tao_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Prometheus 抓取端点：应用侧匿名开放（否则抓不到），此处用网络策略兜住——
    # 指标会泄漏业务量与调用结构，只允许内网/本机访问，公网一律 403。
    location = /actuator/prometheus {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://campus_tao_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ---------- SPA 兜底路由 ----------
    # 前端为 history 模式，未命中的路径一律回落到 index.html；
    # index.html 不缓存，避免发版后客户端仍加载旧入口。
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
